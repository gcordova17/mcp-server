services:
  mcp-server:
    build: .
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    # TICKERNN_AGENT_KEY (tickerNN's AGENT_API_KEY) and TICKERNN_API_URL.
    env_file: .env
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_AGENT_TOKENS=/app/secrets/agents.json
    # Agent bearer tokens (SHA-256 only), managed with `server.py token ...`.
    volumes:
      - ./secrets:/app/secrets
    healthcheck:
      # /mcp requires POST + specific headers, so we hit it with a lightweight
      # GET just to confirm the port is accepting connections.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mcp-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  mcp-net:
    driver: bridge
